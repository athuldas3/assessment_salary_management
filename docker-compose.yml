services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salary_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salary_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      network: host
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/salary_management
      CORS_ORIGINS: http://localhost:8080
      DEBUG: "false"
      LOG_LEVEL: INFO
      SEED_ON_START: "true"
      SEED_COUNT: "10000"
      SEED_BATCH_SIZE: "500"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
